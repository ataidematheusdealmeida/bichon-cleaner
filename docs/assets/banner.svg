    <path d="m154 145 14 14 26-30" stroke="#123e32" stroke-width="7"/>
  </g>
  <text x="968" y="305" fill="#95b9bd" font-family="sans-serif" font-size="14" letter-spacing="2">VERIFY BEFORE DELETE</text>
